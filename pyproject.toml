[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "muwajjih"
version = "1.0.0"
description = "Municipal and government complaint triage service"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.32,<1.0",
  "scikit-learn>=1.5,<2.0",
  "joblib>=1.4,<2.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0"
]

[project.optional-dependencies]
train = [
  "pandas>=2.2,<3.0"
]
supabase = [
  "supabase>=2.9,<3.0"
]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<7.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.7,<1.0",
  "import-linter>=2.1,<3.0",
  "mypy>=1.13,<2.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=src/muwajjih/domain --cov=src/muwajjih/service --cov=src/muwajjih/api --cov-branch --cov-report=term-missing --cov-fail-under=80"
markers = [
  "unit: fast isolated tests",
  "integration: API and wiring tests",
  "behavioural: real-model behaviour tests",
  "slow: tests excluded from the per-commit fast gate"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true

