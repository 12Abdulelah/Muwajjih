name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip

      - run: python -m pip install -e ".[dev]"

      - run: make lint

      - run: make test-fast

      - run: make test

  image-smoke:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - run: docker build -t muwajjih:${{ github.sha }} .

      - run: IMAGE=muwajjih:${{ github.sha }} bash ./scripts/smoke.sh

  publish:
    runs-on: ubuntu-latest
    needs: image-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: docker build -t ghcr.io/12abdulelah/muwajjih:${{ github.sha }} .

      - run: docker push ghcr.io/12abdulelah/muwajjih:${{ github.sha }}
